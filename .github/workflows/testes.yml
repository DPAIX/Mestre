name: Testes locais Python e JavaScript
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unitarios:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Isolar checkout de CI dos dados de uso
        run: python -c "import shutil; shutil.rmtree('dados', ignore_errors=True)"
      - name: Base de fusos para lembretes no Windows
        run: python -m pip install "tzdata>=2024.1,<2027"
      - name: Compilar fontes
        run: python -m compileall -q .
      - name: Executar testes (sem APIs externas)
        run: python -m unittest discover -s testes -v
